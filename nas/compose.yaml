# Auf der NAS: Ordner nas/ hochladen, daneben eine Datei .env anlegen (siehe
# .env.example) und im Container Manager als Projekt starten.
# Nur im Büronetz nutzen: für Port 8080 KEINE Portfreigabe im Router anlegen.
services:
  demo-statistik:
    build: .
    container_name: demo-statistik
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
